[workspace]
resolver = "2"
members = [
    "crates/spoon-core",
    "crates/spoon-graph",
    "crates/spoon-exec",
    "crates/spoon-episode",
    "crates/spoon-reason",
    "crates/spoon-credit",
    "crates/spoon-adapt",
    "crates/spoon-intuition",
    "crates/spoon-capability",
    "crates/spoon-engine",
    "crates/spoon-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
spoon-core = { path = "crates/spoon-core" }
spoon-graph = { path = "crates/spoon-graph" }
spoon-exec = { path = "crates/spoon-exec" }
spoon-episode = { path = "crates/spoon-episode" }
spoon-reason = { path = "crates/spoon-reason" }
spoon-credit = { path = "crates/spoon-credit" }
spoon-adapt = { path = "crates/spoon-adapt" }
spoon-intuition = { path = "crates/spoon-intuition" }
spoon-capability = { path = "crates/spoon-capability" }
spoon-engine = { path = "crates/spoon-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
