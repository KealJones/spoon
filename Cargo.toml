[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
spoon-concept = { path = "crates/spoon-concept" }
spoon-store = { path = "crates/spoon-store" }
spoon-eval = { path = "crates/spoon-eval" }
spoon-natives = { path = "crates/spoon-natives" }
spoon-infer = { path = "crates/spoon-infer" }
spoon-brain = { path = "crates/spoon-brain" }
spoon-teach = { path = "crates/spoon-teach" }
spoon-mouth = { path = "crates/spoon-mouth" }
spoon-ears = { path = "crates/spoon-ears" }
spoon-seat = { path = "crates/spoon-seat" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.9"
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
strsim = "0.11"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = "1"
rust-stemmers = "1"
async-trait = "0.1"
parking_lot = "0.12"
tempfile = "3"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1
