<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spoon</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --bg2: #8881; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; font-weight: 600; }
  nav { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; flex-wrap: wrap; }
  nav button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent;
               padding: .5rem .9rem; cursor: pointer; color: inherit; opacity: .6; }
  nav button.on { border-bottom-color: currentColor; opacity: 1; }
  input { font: inherit; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 4px;
          background: transparent; color: inherit; width: 22rem; margin-bottom: .8rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .7rem .35rem 0; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { font-weight: 600; opacity: .65; position: sticky; top: 0; background: Canvas; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 2rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .stat b { display: block; font-size: 1.4rem; font-weight: 600; }
  .stat span { opacity: .6; font-size: .8rem; }
  .chat { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .chat input { flex: 1; width: auto; margin: 0; }
  .chat button { font: inherit; padding: .4rem 1rem; cursor: pointer; }
  .turn { border-bottom: 1px solid var(--line); padding: .6rem 0; }
  .turn .you { opacity: .6; }
  .turn .meta { opacity: .5; font-size: .8rem; margin-top: .2rem; }
  .turn .learned { font-size: .8rem; margin-top: .2rem; opacity: .85; }
  pre { margin: .2rem 0; white-space: pre-wrap; word-break: break-word; }
  .split { display: grid; grid-template-columns: 15rem 1fr; gap: 1.5rem; align-items: start; }
  .names { display: flex; flex-direction: column; max-height: 78vh; overflow: auto; }
  button.name { font: inherit; text-align: left; background: none; border: 0; color: inherit;
                padding: .25rem .4rem; cursor: pointer; border-radius: 3px; }
  button.name:hover { background: #8882; }
  .detail h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
  .detail h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
               opacity: .55; margin: 1.2rem 0 .3rem; font-weight: 600; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 3px;
          padding: .1rem .45rem; margin: 0 .3rem .3rem 0; font-size: .8rem; }
  .chip.strong { border-color: currentColor; font-weight: 600; }
  .note { opacity: .75; margin: .3rem 0; }
  .hint { opacity: .45; font-size: .8rem; }
  tr.body td { border-bottom: 0; padding-top: 0; opacity: .7; }
  tr.body code { font-size: .85rem; }
  /* SSE event steps */
  .step { font-size: .8rem; padding: .15rem 0 .15rem 1rem; opacity: .7; border-left: 2px solid var(--line); margin: .1rem 0; }
  .step.ears { border-left-color: #6b9; }
  .step.interior { border-left-color: #69b; }
  .step.teacher { border-left-color: #b96; }
  .step.mouth { border-left-color: #96b; }
  .step summary { cursor: pointer; }
  .step pre { font-size: .75rem; opacity: .6; margin: .2rem 0; }
  /* Episode timeline */
  .timeline { margin: .5rem 0; }
  .timeline .stage { margin: .4rem 0; padding: .3rem .6rem; background: var(--bg2); border-radius: 4px; }
  .timeline .stage-head { font-weight: 600; font-size: .8rem; opacity: .7; }
  .timeline .stage-body { font-size: .8rem; margin-top: .2rem; }
  .timeline .stage-body pre { font-size: .75rem; opacity: .65; max-height: 12rem; overflow: auto; }
  /* Expandable rows */
  tr.expandable { cursor: pointer; }
  tr.expandable:hover { background: var(--bg2); }
  tr.detail-row td { padding: .5rem; background: var(--bg2); border-bottom: 2px solid var(--line); }
</style>
</head>
<body>
<h1>spoon</h1>
<nav>
  <button data-tab="chat" class="on">chat</button>
  <button data-tab="status">status</button>
  <button data-tab="concepts">concepts</button>
  <button data-tab="realizations">realizations</button>
  <button data-tab="episodes">episodes</button>
  <button data-tab="prompts">prompts</button>
</nav>
<div id="view"></div>
<script>
const view = document.getElementById('view');
const history = [];
let tab = location.hash.split('&')[0].slice(1) || 'chat';

// --- nav ---
function selectTab(t) {
  tab = t;
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x.dataset.tab === t));
  location.hash = t;
  render();
}
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => selectTab(b.dataset.tab));
window.addEventListener('hashchange', () => {
  const t = location.hash.split('&')[0].slice(1) || 'chat';
  if (t !== tab) selectTab(t);
});

// --- helpers ---
const get = (url) => fetch(url).then(r => r.json());
const esc = (s) => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const num = (v) => v == null ? '-' : (Math.round(v * 100) / 100).toFixed(2);

function table(cols, rows, opts = {}) {
  return `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${
    rows.map((r, i) => {
      const cls = opts.expandable ? ' class="expandable" data-idx="' + i + '"' : '';
      return `<tr${cls}>${r.map((c, j) => `<td class="${typeof c === 'number' ? 'n' : ''}">${esc(c)}</td>`).join('')}</tr>`;
    }).join('')
  }</tbody></table>`;
}

// --- SSE chat ---
async function send(text) {
  if (!text.trim()) return;
  const turn = { you: text, reply: '', steps: [], done: false };
  history.push(turn);
  render();

  try {
    const resp = await fetch('/v1/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'spoon', user: 'inspector', messages: [{ role: 'user', content: text }] })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data:')) {
          try {
            const event = JSON.parse(line.slice(5).trim());
            turn.steps.push(event);
            if (event.type === 'mouth-result') turn.reply = event.reply;
            if (event.type === 'turn-finished') turn.done = true;
            renderChat();
          } catch {}
        }
      }
    }
  } catch (err) {
    turn.reply = 'error: ' + err.message;
    turn.done = true;
  }
  renderChat();
}

function stepHtml(ev) {
  const t = ev.type;
  let cls = 'step';
  if (t.startsWith('ears')) cls += ' ears';
  else if (t.startsWith('interior') || t === 'act-step' || t === 'gap-found') cls += ' interior';
  else if (t.startsWith('teacher') || t === 'learned') cls += ' teacher';
  else if (t.startsWith('mouth')) cls += ' mouth';

  let summary = t;
  if (t === 'ears-result') summary = `ears: ${ev.path} - ${(ev.steps||[]).join(', ')}`;
  else if (t === 'interior-result') summary = `interior: ${ev.result || 'no result'}`;
  else if (t === 'gap-found') summary = `gap: ${ev.concept}`;
  else if (t === 'teacher-reply') summary = `teacher: ${ev.kind} - ${ev.summary}`;
  else if (t === 'learned') summary = `learned: ${ev.note}`;
  else if (t === 'mouth-result') summary = `mouth: ${ev.path}`;
  else if (t === 'turn-finished') summary = `done in ${ev.millis_total}ms`;
  else if (t === 'act-step') summary = `eval: ${ev.concept} -> ${ev.outcome}`;

  const json = JSON.stringify(ev, null, 2);
  return `<details class="${cls}"><summary>${esc(summary)}</summary><pre>${esc(json)}</pre></details>`;
}

function renderChat() {
  const container = document.getElementById('chat-history');
  if (!container) return;
  container.innerHTML = history.slice().reverse().map(h => {
    const stepsHtml = h.steps
      .filter(s => s.type !== 'turn-started')
      .map(stepHtml).join('');
    const replyText = h.done ? (h.reply || '(no reply)') : (h.reply || '...');
    return `<div class="turn"><div class="you">&gt; ${esc(h.you)}</div>${stepsHtml}<pre>${esc(replyText)}</pre></div>`;
  }).join('');
}

let picked = null;

async function showConcept(name) {
  picked = name;
  const d = await get('/debug/concept?name=' + encodeURIComponent(name));
  const detail = document.getElementById('detail');
  const section = (title, body) => body ? `<h2>${title}</h2>${body}` : '';
  const chips = (xs) => xs && xs.length
    ? `<div>${xs.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';
  const lines = (xs) => xs && xs.length
    ? `<pre>${xs.map(esc).join('\n')}</pre>` : '';

  detail.innerHTML = `
    <h1>${esc(d.name)}</h1>
    <div class="tags">
      <span class="chip strong">${esc(d.kind)}</span>
      ${d.tier ? `<span class="chip">${esc(d.tier)}</span>` : ''}
      ${d.source ? `<span class="chip">${esc(d.source)}</span>` : ''}
      <span class="chip">${d.realization_count} realization${d.realization_count === 1 ? '' : 's'}</span>
      <span class="chip">${d.uses} use${d.uses === 1 ? '' : 's'}</span>
      ${d.success_rate != null ? `<span class="chip">${num(d.success_rate)} success</span>` : ''}
    </div>
    ${d.note ? `<p class="note">${esc(d.note)}</p>` : ''}
    ${section('surface forms', chips(d.surface_forms))}
    ${section('declared properties', lines(d.properties))}
    ${section('how it can be carried out', d.realizations.length ? `<table>
      <thead><tr><th>name</th><th>kind</th><th>source</th><th>effect</th><th>score</th><th>uses</th><th>ok</th><th>fail</th></tr></thead>
      <tbody>${d.realizations.map(r => `<tr>
        <td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.source)}</td>
        <td>${esc(r.effect)}</td><td class="n">${num(r.score)}</td>
        <td class="n">${r.uses}</td><td class="n">${r.successes}</td><td class="n">${r.failures}</td>
      </tr>${r.body ? `<tr class="body"><td colspan="8"><code>${esc(r.body)}</code></td></tr>` : ''}`).join('')}
      </tbody></table>` : '<p class="hint">nothing realizes it, so it is data</p>')}
    ${section('facts it heads', lines(d.facts))}
    ${section('where it appears', lines(d.appears_in))}
    <p class="hint">${esc(d.id)}</p>`;
}

function renderEpisodeTimeline(ep) {
  const stage = (name, cls, content) =>
    content ? `<div class="stage"><div class="stage-head ${cls}">${name}</div><div class="stage-body">${content}</div></div>` : '';

  const earsRaw = ep.ears_exchange
    ? `<details><summary>raw model output</summary><pre>${esc(ep.ears_exchange.raw_response)}</pre></details>
       <details><summary>full prompt</summary><pre style="max-height:20rem;overflow:auto">${esc(
         (ep.ears_exchange.messages || []).map(m => `[${m.role}]\n${m.content}`).join('\n\n---\n\n')
       )}</pre></details>`
    : '';
  const ears = earsRaw;
  const stepsSource = ep.steps_rendered || ep.steps || [];
  const steps = stepsSource.length
    ? `<div>${stepsSource.map(s => `<span class="chip">${esc(typeof s === 'string' ? s : JSON.stringify(s))}</span>`).join('')}</div>`
    : '';
  const trace = (ep.trace || []).length
    ? `<table><thead><tr><th>concept</th><th>realization</th><th>outcome</th><th>depth</th></tr></thead><tbody>${
        ep.trace.map(t => `<tr><td>${esc(t.concept)}</td><td>${esc(t.realization||'-')}</td><td>${esc(t.outcome)}</td><td class="n">${t.depth}</td></tr>`).join('')
      }</tbody></table>`
    : '';
  const teacher = (ep.teacher_exchanges || []).length
    ? ep.teacher_exchanges.map((ex, i) =>
        `<details><summary>exchange ${i+1}</summary><pre>${esc(ex.raw_response)}</pre></details>`
      ).join('')
    : '';
  const mouth = ep.mouth_exchange
    ? `<details><summary>raw model output</summary><pre>${esc(ep.mouth_exchange.raw_response)}</pre></details>
       <details><summary>full prompt</summary><pre style="max-height:20rem;overflow:auto">${esc(
         (ep.mouth_exchange.messages || []).map(m => `[${m.role}]\n${m.content}`).join('\n\n---\n\n')
       )}</pre></details>`
    : '';
  const learning = (ep.learning || []).length
    ? ep.learning.map(l => `<div class="learned">+ ${esc(l)}</div>`).join('')
    : '';

  return `<div class="timeline">
    ${stage('Input', '', `<pre>${esc(ep.user_text)}</pre>`)}
    ${ep.goal_rendered ? stage('Goal', '', `<span class="chip">${esc(ep.goal_rendered)}</span>`) : ''}
    ${stage('Ears', 'ears', `<span class="chip">${esc(ep.ears_path)}</span> ${steps}${ears}`)}
    ${trace ? stage('Eval trace', 'interior', trace) : ''}
    ${(ep.gaps||[]).length ? stage('Gaps', '', (ep.gaps_rendered || ep.gaps || []).map(g => `<span class="chip">${esc(typeof g === 'string' ? g : JSON.stringify(g))}</span>`).join('')) : ''}
    ${teacher ? stage('Teacher', 'teacher', teacher) : ''}
    ${learning ? stage('Learned', 'teacher', learning) : ''}
    ${stage('Mouth', 'mouth', `<span class="chip">${esc(ep.mouth_path)}</span>${mouth}`)}
    ${ep.result_rendered ? stage('Result', '', `<span class="chip">${esc(ep.result_rendered)}</span>`) : ''}
    ${stage('Reply', '', `<pre>${esc(ep.reply)}</pre>`)}
    <div style="font-size:.75rem;opacity:.4">episode ${ep.id} - ${ep.metrics?.millis_total ?? '?'}ms total (ears ${ep.metrics?.millis_ears ?? '?'}ms, interior ${ep.metrics?.millis_interior ?? '?'}ms, mouth ${ep.metrics?.millis_mouth ?? '?'}ms)</div>
  </div>`;
}

async function render() {
  if (tab === 'chat') {
    view.innerHTML = `<div class="chat"><input id="msg" placeholder="say something" autofocus><button id="go">send</button></div><div id="chat-history"></div>`;
    renderChat();
    const msg = document.getElementById('msg');
    const go = () => { const t = msg.value; msg.value = ''; send(t); };
    document.getElementById('go').onclick = go;
    msg.onkeydown = e => { if (e.key === 'Enter') go(); };
    msg.focus();
    return;
  }
  if (tab === 'prompts') {
    const d = await get('/debug/episodes?limit=20');
    const episodes = d.episodes || [];
    let html = '<h2 style="font-size:.9rem;opacity:.6">Recent LLM exchanges per episode</h2>';
    for (const ep of episodes) {
      const full = await get('/debug/episode?id=' + ep.id);
      const exchanges = [];
      if (full.ears_exchange) {
        exchanges.push({seat: 'Ears', ex: full.ears_exchange});
      }
      for (const [i, tex] of (full.teacher_exchanges || []).entries()) {
        exchanges.push({seat: `Teacher #${i+1}`, ex: tex});
      }
      if (full.mouth_exchange) {
        exchanges.push({seat: 'Mouth', ex: full.mouth_exchange});
      }
      if (exchanges.length === 0) continue;
      html += `<div class="turn" style="margin-bottom:1rem">
        <div class="you">#${ep.id}: ${esc(ep.user_text)} -> ${esc(ep.reply)}</div>`;
      for (const {seat, ex} of exchanges) {
        const msgs = (ex.messages || []).map(m =>
          `<div style="margin:.3rem 0"><span class="chip strong">${esc(m.role)}</span><pre style="max-height:15rem;overflow:auto;margin:.2rem 0">${esc(m.content)}</pre></div>`
        ).join('');
        html += `<details class="step" style="margin:.3rem 0">
          <summary><b>${esc(seat)}</b> - ${(ex.messages||[]).length} messages</summary>
          ${msgs}
          <div style="margin-top:.4rem"><span class="chip">Response:</span><pre style="max-height:10rem;overflow:auto">${esc(ex.raw_response)}</pre></div>
        </details>`;
      }
      html += '</div>';
    }
    view.innerHTML = html;
    return;
  }
  if (tab === 'status') {
    const s = await get('/debug/status');
    view.innerHTML = `<div class="stats">${
      Object.entries(s).map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')
    }</div>`;
    return;
  }
  const q = new URLSearchParams(location.hash.split('&').slice(1).join('&')).get('q') || '';
  const filter = `<input id="q" placeholder="filter" value="${esc(q)}">`;
  if (tab === 'concepts') {
    const d = await get('/debug/concepts?limit=800&q=' + encodeURIComponent(q));
    view.innerHTML = filter +
      `<div class="split"><div class="names">${
        d.names.map(n => `<button class="name" data-name="${esc(n)}">${esc(n)}</button>`).join('')
      }</div><div id="detail" class="detail"><p class="hint">pick a concept</p></div></div>`;
    document.querySelectorAll('button.name').forEach(b =>
      b.onclick = () => showConcept(b.dataset.name));
    if (picked) showConcept(picked);
  } else if (tab === 'realizations') {
    const d = await get('/debug/realizations?limit=500&q=' + encodeURIComponent(q));
    const summary = `<div class="stats">${
      (d.by_source || []).map(s => `<div class="stat"><b>${s.count}</b><span>${esc(s.source)} &middot; ${
        num(s.mean_success_rate)} rate &middot; ${s.uses} uses</span></div>`).join('')
    }</div>`;
    view.innerHTML = summary + filter + table(
      ['name', 'target', 'source', 'kind', 'effect', 'tier', 'score', 'rate', 'uses', 'ok', 'fail'],
      d.realizations
        .slice()
        .sort((a, b) => (b.score ?? 0) - (a.score ?? 0))
        .map(r => [r.name, r.target, r.source, r.kind, r.effect, r.tier,
                   num(r.score), num(r.success_rate), r.uses, r.successes, r.failures]));
  } else if (tab === 'episodes') {
    const d = await get('/debug/episodes?limit=100');
    view.innerHTML = `<table><thead><tr><th>#</th><th>said</th><th>replied</th><th>ears</th><th>gaps</th><th>ms</th></tr></thead><tbody>${
      d.episodes.map(e => {
        const row = `<tr class="expandable" data-id="${e.id}"><td class="n">${e.id}</td><td>${esc(e.user_text)}</td><td>${esc(e.reply)}</td><td>${esc(e.ears_path)}</td><td class="n">${(e.gaps||[]).length}</td><td class="n">${e.metrics?.millis_total ?? 0}</td></tr>`;
        return row;
      }).join('')
    }</tbody></table>`;
    document.querySelectorAll('tr.expandable').forEach(tr => {
      tr.onclick = async () => {
        const existing = tr.nextElementSibling;
        if (existing && existing.classList.contains('detail-row')) {
          existing.remove();
          return;
        }
        const ep = await get('/debug/episode?id=' + tr.dataset.id);
        const detail = document.createElement('tr');
        detail.classList.add('detail-row');
        detail.innerHTML = `<td colspan="6">${renderEpisodeTimeline(ep)}</td>`;
        tr.after(detail);
      };
    });
  }
  const input = document.getElementById('q');
  if (input) {
    input.oninput = () => { location.hash = tab + '&q=' + encodeURIComponent(input.value); render(); };
  }
}

// init
selectTab(tab);
</script>
</body>
</html>
